app = "bahaya"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[processes]
  web = "python main.py"

[[services]]
  internal_port = 8080
  protocol = "tcp"
  processes = ["web"]

  [[services.ports]]
    port = 80

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

[vm]
  memory = '256mb' # <-- GANTI DARI '256mb'
  cpu_kind = 'shared'
  cpus = 1
