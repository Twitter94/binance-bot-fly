# fly.toml app configuration file generated for bahaya on 2026-08-28T16:19:21Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = "bahaya"
primary_region = 'sin'

[build]
dockerfile = "Dockerfile"

[env]
TZ = "Asia/Jakarta"

[processes]
  app = 'python main.py'

[deploy]

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256

[[restart]]
  policy = 'always'
  processes = ['app']
  retries = 10
