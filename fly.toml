app = "bahaya"
primary_region = "sin"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  
[processes]
app = "python main.py" # <-- INI YANG DIGANTI

[deploy]
restart_policy = "always"

[[vm]]
  cpus = 1
  memory = "256mb"

[env]
  TZ = "Asia/Jakarta"
