# fly.toml app configuration file generated for bahaya on 2026-08-18T11:59:26Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = "bahaya"
primary_region = 'sin'

[build]
  dockerfile = "Dockerfile"

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1

[processes]
  app = 'python main.py'

[[restart]]
  policy = 'always'
  processes = ['app']
  retries = 10
