app = "bahaya"
primary_region = "sin"

[processes]
app = "python main.py"

[http_service]
auto_start_machines = true
auto_stop_machines = false
force_https = true
internal_port = 8080
min_machines_running = 1

[[restart]]
policy = "always"
processes = ["app"]
retries = 10

[[vm]]
cpus = 1
memory = "256mb"
memory_mb = 256

