app = 'bahaya'
primary_region = 'sin' # Singapore paling deket Soko

[build]
  image = "registry.fly.io/bahaya:deployment-ab140d8b05e65d8b123727217b48dd81"

[env]
  PYTHONUNBUFFERED = "1" # Biar log langsung keluar

[processes]
  app = "python main.py" # Ganti sesuai nama file bot kamu

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"

# PENTING: HAPUS SEMUA BAGIAN [[services]] KALAU ADA
# JANGAN ADA [[services.ports]] KARENA INI BUKAN WEB
